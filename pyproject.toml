[project]
name = "hefesto-mod-imersao"
version = "0.2.0"
description = "O Modo imersão do Hefesto: o motor de receitas que leva a cena do jogo ao controle"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
extend-select = ["E402", "S307"]

[tool.mypy]
python_version = "3.10"
